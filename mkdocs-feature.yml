site_name: SCL.Feature
docs_dir: doc/mkdocs-feature
site_dir: site/feature

theme:
  name: material
  palette:
    scheme: default
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes

extra:
  version:
    provider: mike

plugins:
  - search
  - mkdoxy:
      projects:
        scl-feature:
          src-dirs: module/feature/src
          full-doc: True
          doxy-cfg:
            PROJECT_NAME: SCL.Feature
            RECURSIVE: "YES"
            FILE_PATTERNS: "*.h *.hpp *.hh"
            EXTRACT_ALL: "NO"
            HIDE_UNDOC_MEMBERS: "YES"
            HIDE_UNDOC_CLASSES: "YES"
            HIDE_UNDOC_NAMESPACES: "YES"
            EXCLUDE_PATTERNS: "*/detail/*"

nav:
  - Home: index.md
