name: Build (macOS & Windows)

# GitHub gives free macOS and Windows runners, which GitLab.com's shared
# runners don't (or charge extra for). Linux (clang/gcc, all archs) is
# covered in .gitlab-ci.yml instead.
#
# Windows is pinned to windows-2022, not windows-latest: the presets use the
# "Visual Studio 17 2022" CMake generator by name, and windows-latest is not
# guaranteed to keep shipping that VS version once GitHub rolls the alias
# forward to a newer runner image.
#
# msvc-arm64 is build-only: no test preset exists for it in
# CMakePresets.json, and ARM64 binaries cannot execute on an x64 runner
# anyway (matches CONTRIBUTING.md's "cross on an x64 host" note).
#
# No native macos-x64 job: GitHub's Intel-hosted macos-13 runners are
# retired (jobs requesting that label queue forever, never getting a
# runner assigned). x86_64 is still covered at the binary level through
# macos-universal.

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: ['*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            preset: macos-arm64
            test: true
          - os: macos-14
            preset: macos-universal
            test: true
          - os: windows-2022
            preset: msvc-x64
            test: true
          - os: windows-2022
            preset: msvc-x86
            test: true
          - os: windows-2022
            preset: msvc-arm64
            test: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Configure and build
        shell: bash
        run: script/ci/build.sh ${{ matrix.preset }} Debug

      - name: Test
        if: matrix.test
        shell: bash
        run: script/ci/run_tests.sh ${{ matrix.preset }} Debug
