name: Build (macOS, Windows, Linux & MinGW)

# GitHub gives free macOS and Windows runners, which GitLab.com's shared
# runners don't (or charge extra for). The `build` job covers those:
# msvc (x64/x86/arm64) and macos (arm64/universal).
#
# `build-linux` duplicates .gitlab-ci.yml's clang/gcc matrix here too, so the
# full matrix is verifiable on GitHub alone (no dependency on GitLab CI being
# up) and via the throwaway-mirror-PR trick used to pre-verify this file.
#
# `build-mingw` covers gcc and clang targeting the mingw-w64 (GNU) ABI on
# Windows, via MSYS2 — a genuinely different environment from `msvc-*`
# (different runtime/ABI), not a duplicate of it. Only the x64 pair is
# covered: MSYS2's 32-bit MINGW32/CLANG32 toolchains are not multilib, so the
# `clang-x86`/`gcc-x86` presets' `-m32` flag (needed to select 32-bit output
# from the 64-bit-capable Linux/MSVC toolchains) does not apply there and
# would need a dedicated preset instead.
#
# Windows is pinned to windows-2022, not windows-latest: the presets use the
# "Visual Studio 17 2022" CMake generator by name, and windows-latest is not
# guaranteed to keep shipping that VS version once GitHub rolls the alias
# forward to a newer runner image.
#
# msvc-arm64 runs on windows-11-arm (a genuine ARM64 host), not
# windows-2022 (x64): an ARM64 binary cannot execute on an x64 runner at
# all. Since GitHub's ARM64 Windows runners come with VS preinstalled,
# this preset is not cross/build-only in CI the way CONTRIBUTING.md's
# preset table describes it for a plain x64 dev machine.
#
# No native macos-x64 job: GitHub's Intel-hosted macos-13 runners are
# retired (jobs requesting that label queue forever, never getting a
# runner assigned). x86_64 is still covered at the binary level through
# macos-universal.
#
# macos-14's bundled Xcode clang (AppleClang 15.0.0) segfaults compiling
# module/utility's key_nttp.cpp example (a known AppleClang 15/16 frontend
# bug around C++20 class-type NTTPs used in template specializations) --
# the same class of crash `build-linux` already works around by pinning
# silkeh/clang:21 instead of Ubuntu's stock clang. macOS has no Docker
# image option, so the `build` job installs Homebrew LLVM instead and
# points CC/CXX at it for the macos-14 matrix entries. CMAKE_AR/RANLIB
# stay pinned to Apple's native /usr/bin/ar and /usr/bin/ranlib though --
# Homebrew LLVM's llvm-ar writes archives Apple's ld can't read back for
# fat (multi-arch) binaries, which macos-universal needs.

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: ['*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            preset: macos-arm64
            test: true
          - os: macos-14
            preset: macos-universal
            test: true
          - os: windows-2022
            preset: msvc-x64-2022
            test: true
          - os: windows-2022
            preset: msvc-x86-2022
            test: true
          - os: windows-11-arm
            preset: msvc-arm64-2022
            test: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install LLVM (macOS)
        if: runner.os == 'macOS'
        run: brew install llvm

      - name: Configure and build
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            export CC=/opt/homebrew/opt/llvm/bin/clang
            export CXX=/opt/homebrew/opt/llvm/bin/clang++
            # Homebrew LLVM's llvm-ar produces archives Apple's ld can't read
            # for fat (multi-arch) binaries -- keep Apple's native archiver.
            script/ci/build.sh ${{ matrix.preset }} Debug \
              -DCMAKE_AR=/usr/bin/ar -DCMAKE_RANLIB=/usr/bin/ranlib
          else
            script/ci/build.sh ${{ matrix.preset }} Debug
          fi

      - name: Test
        if: matrix.test
        shell: bash
        run: script/ci/run_tests.sh ${{ matrix.preset }} Debug

  build-linux:
    # Same images as .gitlab-ci.yml's Linux jobs, for the same reason: Ubuntu's
    # default `clang` package (18) crashes (SIGSEGV in Sema::SubstInitializer)
    # instantiating module/feature's detection-idiom templates, so clang jobs
    # pin the same silkeh/clang:21 image instead of ubuntu-latest's default.
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: clang-x64
            image: silkeh/clang:21
            packages: ""
            test: true
          - preset: gcc-x64
            image: ubuntu:24.04
            packages: g++
            test: true
          - preset: clang-x86
            image: silkeh/clang:21
            packages: gcc-multilib g++-multilib
            test: true
          - preset: gcc-x86
            image: ubuntu:24.04
            packages: g++ gcc-multilib g++-multilib
            test: true
          - preset: clang-arm64
            image: silkeh/clang:21
            packages: crossbuild-essential-arm64
            test: false
          - preset: gcc-arm64
            image: ubuntu:24.04
            packages: crossbuild-essential-arm64
            test: false
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    steps:
      # Runs before checkout: neither image ships git, which actions/checkout
      # needs for the recursive-submodule fetch.
      - name: Install toolchain
        run: apt-get update -qq && apt-get install -y -qq cmake ninja-build git ${{ matrix.packages }}

      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Configure and build
        run: script/ci/build.sh ${{ matrix.preset }} Debug

      - name: Test
        if: matrix.test
        run: script/ci/run_tests.sh ${{ matrix.preset }} Debug

  build-mingw:
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: gcc-x64
            msystem: MINGW64
            packages: mingw-w64-x86_64-toolchain
          - preset: clang-x64
            msystem: CLANG64
            packages: mingw-w64-clang-x86_64-toolchain
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: ${{ matrix.packages }} cmake ninja git

      - name: Configure and build
        run: script/ci/build.sh ${{ matrix.preset }} Debug

      - name: Test
        run: script/ci/run_tests.sh ${{ matrix.preset }} Debug
