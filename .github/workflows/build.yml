name: Build (macOS, Windows, Linux & MinGW)

on:
  push:
    branches: ['**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            preset: macos-arm64
            test: true
          - os: macos-14
            preset: macos-universal
            test: true
          - os: windows-2022
            preset: msvc-x64-2022
            test: true
          - os: windows-2022
            preset: msvc-x86-2022
            test: true
          - os: windows-11-arm
            preset: msvc-arm64-2022
            test: true
          # No tests: the MSVC STL declares std::any only under _HAS_STATIC_RTTI,
          # and the vendored GoogleTest specialises UniversalPrinter<std::any> for it
          # unconditionally, so gtest.h stops compiling once RTTI is off.
          - os: windows-2022
            preset: clang-x64
            flags: --no-rtti -DSCL_BUILD_TESTS=OFF
            test: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      # macos-14's Xcode clang segfaults on a C++20 class-type NTTP in an example.
      - name: Install LLVM (macOS)
        if: runner.os == 'macOS'
        run: brew install llvm

      - name: Configure and build
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            export CC=/opt/homebrew/opt/llvm/bin/clang
            export CXX=/opt/homebrew/opt/llvm/bin/clang++
            # llvm-ar writes archives Apple's ld cannot read back for a fat binary.
            script/ci/build.sh ${{ matrix.preset }} Release ${{ matrix.flags }} \
              -DCMAKE_AR=/usr/bin/ar -DCMAKE_RANLIB=/usr/bin/ranlib
          else
            script/ci/build.sh ${{ matrix.preset }} Release ${{ matrix.flags }}
          fi

      - name: Test
        if: matrix.test
        shell: bash
        run: script/ci/run_tests.sh ${{ matrix.preset }} Release ${{ matrix.flags }}

  build-linux:
    # A pinned image, so a raised base image cannot move the compiler under the matrix.
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: clang-x64
            image: silkeh/clang:22
            packages: ""
            test: true
          - preset: gcc-x64
            image: ubuntu:24.04
            packages: g++
            test: true
          - preset: clang-x86
            image: silkeh/clang:22
            packages: gcc-multilib g++-multilib
            test: true
          - preset: gcc-x86
            image: ubuntu:24.04
            packages: g++ gcc-multilib g++-multilib
            test: true
          - preset: clang-arm64
            image: silkeh/clang:22
            packages: crossbuild-essential-arm64
            test: false
          - preset: gcc-arm64
            image: ubuntu:24.04
            packages: crossbuild-essential-arm64
            test: false
          - preset: clang-x64
            image: silkeh/clang:22
            packages: ""
            flags: --no-rtti
            test: true
          - preset: gcc-x64
            image: ubuntu:24.04
            packages: g++
            flags: --no-rtti
            test: true
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    steps:
      # Before checkout: neither image ships the git that actions/checkout needs.
      - name: Install toolchain
        run: apt-get update -qq && apt-get install -y -qq cmake ninja-build git ${{ matrix.packages }}

      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Configure and build
        run: script/ci/build.sh ${{ matrix.preset }} Release ${{ matrix.flags }}

      - name: Test
        if: matrix.test
        run: script/ci/run_tests.sh ${{ matrix.preset }} Release ${{ matrix.flags }}

  build-mingw:
    # x64 only: MSYS2's 32-bit toolchains are not multilib, so -m32 does not apply.
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: gcc-x64
            msystem: MINGW64
            packages: mingw-w64-x86_64-toolchain
          - preset: clang-x64
            msystem: CLANG64
            packages: mingw-w64-clang-x86_64-toolchain
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: ${{ matrix.packages }} cmake ninja git

      - name: Configure and build
        run: script/ci/build.sh ${{ matrix.preset }} Release

      - name: Test
        run: script/ci/run_tests.sh ${{ matrix.preset }} Release
