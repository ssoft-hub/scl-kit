site_name: SCL.Utility
docs_dir: doc/mkdocs-utility
site_dir: site/utility

theme:
  name: material
  palette:
    scheme: default
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes

extra:
  version:
    provider: mike

plugins:
  - search
  - mkdoxy:
      projects:
        scl-utility:
          src-dirs: module/utility/src
          full-doc: True
          doxy-cfg:
            PROJECT_NAME: SCL.Utility
            RECURSIVE: "YES"
            FILE_PATTERNS: "*.h *.hpp *.hh"
            EXTRACT_ALL: "NO"
            HIDE_UNDOC_MEMBERS: "YES"
            HIDE_UNDOC_CLASSES: "YES"
            HIDE_UNDOC_NAMESPACES: "YES"
            EXCLUDE_PATTERNS: "*/detail/*"

nav:
  - Home: index.md
