# The full matrix runs in .github/workflows/build.yml, which every branch reaches
# through a push mirror configured on the project rather than through a job here.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH =~ /^(main|dev)$/
    - if: $CI_COMMIT_TAG =~ /^v[0-9]/

stages: [build, release]

.build_job:
  stage: build
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
    GIT_SUBMODULE_DEPTH: 1
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^(main|dev)$/
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: false

build:clang-x64:
  extends: .build_job
  # A published release rather than the base image's default, so a raised image
  # cannot move the compiler under the job.
  image: silkeh/clang:22
  before_script:
    - apt-get update -qq && apt-get install -y -qq cmake ninja-build git
  script:
    - script/ci/build.sh clang-x64 Debug
    - script/ci/run_tests.sh clang-x64 Debug

build:gcc-x64:
  extends: .build_job
  image: ubuntu:24.04
  before_script:
    - apt-get update -qq && apt-get install -y -qq cmake ninja-build g++ git
  script:
    - script/ci/build.sh gcc-x64 Debug
    - script/ci/run_tests.sh gcc-x64 Debug

# ---------------------
# Release
# ---------------------
# Header-only toolkit: nothing to build for a release, just publish a GitLab
# Release with the CHANGELOG.md section for this tag as its description.
release:
  stage: release
  image: alpine:latest
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]/
  variables:
    GIT_SUBMODULE_STRATEGY: none
  before_script:
    - apk add --no-cache bash curl jq
  script:
    - bash script/ci/create_gitlab_release.sh
