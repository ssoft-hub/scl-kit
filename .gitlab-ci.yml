stages: [build, release, publish]

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  GIT_SUBMODULE_DEPTH: 1

# ---------------------
# Build matrix
# ---------------------
# Linux only: GitLab.com's shared runners are Linux-only. Windows/macOS live
# in .github/workflows/build.yml, on GitHub's free hosted runners instead.
#
# arm64 (cross) jobs are build-only: CMakePresets.json ships no test preset
# for them, since arm64 binaries cannot execute on an x64 runner at all.
# x86 (32-bit) binaries run fine on an x64 host given the multilib runtime,
# so those jobs configure, build, and test like x64 does.
.build_rules:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH =~ /^(main|dev)$/

build:clang-x64:
  stage: build
  image: silkeh/clang:21
  extends: .build_rules
  before_script:
    - apt-get update -qq && apt-get install -y -qq cmake ninja-build git
  script:
    - script/ci/build.sh clang-x64 Debug
    - script/ci/run_tests.sh clang-x64 Debug

build:gcc-x64:
  stage: build
  image: ubuntu:24.04
  extends: .build_rules
  before_script:
    - apt-get update -qq && apt-get install -y -qq cmake ninja-build g++ git
  script:
    - script/ci/build.sh gcc-x64 Debug
    - script/ci/run_tests.sh gcc-x64 Debug

build:clang-x64-no-rtti:
  stage: build
  image: silkeh/clang:21
  extends: .build_rules
  before_script:
    - apt-get update -qq && apt-get install -y -qq cmake ninja-build git
  script:
    - script/ci/build.sh clang-x64-no-rtti Debug
    - script/ci/run_tests.sh clang-x64-no-rtti Debug

build:gcc-x64-no-rtti:
  stage: build
  image: ubuntu:24.04
  extends: .build_rules
  before_script:
    - apt-get update -qq && apt-get install -y -qq cmake ninja-build g++ git
  script:
    - script/ci/build.sh gcc-x64-no-rtti Debug
    - script/ci/run_tests.sh gcc-x64-no-rtti Debug

build:clang-x86:
  stage: build
  image: silkeh/clang:21
  extends: .build_rules
  before_script:
    - apt-get update -qq && apt-get install -y -qq cmake ninja-build git gcc-multilib g++-multilib
  script:
    - script/ci/build.sh clang-x86 Debug
    - script/ci/run_tests.sh clang-x86 Debug

build:gcc-x86:
  stage: build
  image: ubuntu:24.04
  extends: .build_rules
  before_script:
    - apt-get update -qq && apt-get install -y -qq cmake ninja-build g++ git gcc-multilib g++-multilib
  script:
    - script/ci/build.sh gcc-x86 Debug
    - script/ci/run_tests.sh gcc-x86 Debug

build:clang-arm64:
  stage: build
  image: silkeh/clang:21
  extends: .build_rules
  before_script:
    - apt-get update -qq && apt-get install -y -qq cmake ninja-build git crossbuild-essential-arm64
  script:
    - script/ci/build.sh clang-arm64 Debug

build:gcc-arm64:
  stage: build
  image: ubuntu:24.04
  extends: .build_rules
  before_script:
    - apt-get update -qq && apt-get install -y -qq cmake ninja-build git crossbuild-essential-arm64
  script:
    - script/ci/build.sh gcc-arm64 Debug

# ---------------------
# Release
# ---------------------
# Header-only toolkit: nothing to build for a release, just publish a GitLab
# Release with the CHANGELOG.md section for this tag as its description.
release:
  stage: release
  image: alpine:latest
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]/
  before_script:
    - apk add --no-cache bash curl jq
  script:
    - bash script/ci/create_gitlab_release.sh

# ---------------------
# Mirror to GitHub
# ---------------------
mirror:github:
  stage: publish
  image:
    name: alpine/git
    entrypoint: [""]
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: 0
    # Set in GitLab CI/CD group variables (ssoft-scl):
    #   GITHUB_TOKEN       - GitHub PAT with Contents: Write (masked)
    # Set in GitLab CI/CD project variables:
    #   GITHUB_MIRROR_URL  - https://github.com/ssoft-hub/scl-kit.git
  script:
    - sh script/ci/mirror_github.sh
